# CI5/CI6 (openspec/specs/integracion-continua/spec.md): un solo job que invoca `npm run ci`
# (D8 de openspec/changes/fase-00b-ci-contrato-api/design.md) sin redefinir ningún paso individual
# aquí. `fetch-depth: 0` porque `commits` necesita `merge-base(main, HEAD)` y `contrato:diff`
# necesita comparar el documento público contra `main` (D11). Docker ya viene preinstalado en
# `ubuntu-latest`, que es lo que usan `secretos`, `contrato:diff` y `flujos` (D10) y lo que levanta
# Testcontainers para `test:integracion`/`test:e2e` (ADR-0009).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: npm run ci
    runs-on: ubuntu-latest
    env:
      # Solo una bandera: el token nunca entra al entorno de los demás pasos (instalación, `npm run ci`).
      HAY_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Los runners de GitHub comparten IP y Docker Hub limita las descargas anónimas (`toomanyrequests`): sin
      # sesión, `gitleaks`, `oasdiff`, `actionlint` y las imágenes de Testcontainers fallan al azar. El login es
      # opcional: sin los secretos (un fork, por ejemplo) el paso se salta y el CI sigue como antes.
      - name: Iniciar sesión en Docker Hub
        if: ${{ env.HAY_DOCKERHUB == 'true' }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # Cada aplicación tiene su propio package-lock (ADR-0023): `servicio/` y `cliente/` (CI10).
          cache-dependency-path: |
            servicio/package-lock.json
            cliente/package-lock.json

      # Cada aplicación se instala con su propio lockfile; la raíz no tiene dependencias (ADR-0023).
      - name: Instalar dependencias
        run: npm run instalar

      # `npm run ci` de la raíz: el ci del servicio, el del cliente y la auditoría del cliente.
      - name: Ejecutar la secuencia completa de CI
        run: npm run ci
